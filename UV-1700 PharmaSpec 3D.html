<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UV-1700 PharmaSpec 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf9f5;--fg:#1f1e1d;--mu:#5f5e5a;--card:#f1efe8;--bd:#d3d1c7;--ac:#185FA5;--acb:#e6f1fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--fg:#f1efe8;--mu:#b4b2a9;--card:#2c2c2a;--bd:#444441;--ac:#85B7EB;--acb:#0c447c}}
:root[data-theme="dark"]{--bg:#1f1e1d;--fg:#f1efe8;--mu:#b4b2a9;--card:#2c2c2a;--bd:#444441;--ac:#85B7EB;--acb:#0c447c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:500;margin:0}
.sub{font-size:14px;color:var(--mu);margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 8px}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0}
.on{background:var(--acb)!important;color:var(--ac)!important}
.chip.on{border-color:var(--ac)}
#cv{width:100%;height:min(64vh,560px);min-height:340px;display:block;touch-action:none;cursor:grab;border-radius:12px;background:var(--card)}
#cv:active{cursor:grabbing}
.hint{font-size:13px;color:var(--mu);margin:6px 0}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.info{background:var(--card);border-radius:8px;padding:12px 16px;min-height:72px}
#i-name{font-weight:500;font-size:16px}
#i-desc{font-size:14px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Shimadzu UV-1700 PharmaSpec</h1>
<p class="sub">Model 3D spektrofotometer UV-Vis. Putar 360°, lihat bagian luar dan dalam.</p>
<div class="bar">
  <div class="seg"><button id="b-ext" class="on">Tampak luar</button><button id="b-int">Tampak dalam</button></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="b-lid">Buka tutup sampel</button><button id="b-auto">Putar otomatis: nyala</button><button id="b-reset">Reset</button></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Seret untuk memutar, scroll atau cubit untuk zoom, klik bagian alat untuk info.</div>
<div id="chips"></div>
<div class="info"><div id="i-name"></div><div id="i-desc"></div></div>
</main>
